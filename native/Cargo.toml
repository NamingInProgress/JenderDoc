[package]
name = "jenderdoc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
debug = false

[dependencies]
jni = "0.22.4"
paste = "1.0.15"
renderdoc = "0.12.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["d3d11"] }
